<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trade Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0D0A;
    --surface:#14170F;
    --surface-2:#1B1F14;
    --border:rgba(255,176,0,0.16);
    --border-strong:rgba(255,176,0,0.32);
    --amber:#FFB000;
    --amber-dim:#C9A227;
    --text:#EDE6D6;
    --text-dim:#9A9686;
    --green:#5CE65C;
    --red:#FF5D5D;
    --mono:'JetBrains Mono', monospace;
    --sans:'Inter', sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:var(--sans);
    min-height:100vh;
  }
  ::selection{background:var(--amber);color:#000;}
  .ticker-wrap{
    border-bottom:1px solid var(--border);
    background:var(--surface);
    overflow:hidden;
    white-space:nowrap;
    padding:10px 0;
  }
  .ticker{
    display:inline-block;
    font-family:var(--mono);
    font-size:13px;
    animation:scroll 30s linear infinite;
    padding-left:100%;
  }
  .ticker span{margin-right:40px;}
  .ticker .up{color:var(--green);}
  .ticker .down{color:var(--red);}
  .ticker .flat{color:var(--amber-dim);}
  @keyframes scroll{
    0%{transform:translateX(0);}
    100%{transform:translateX(-100%);}
  }
  .cursor{
    display:inline-block;width:8px;height:14px;background:var(--amber);
    animation:blink 1s step-end infinite;vertical-align:-2px;margin-left:4px;
  }
  @keyframes blink{50%{opacity:0;}}

  .wrap{max-width:1080px;margin:0 auto;padding:28px 20px 60px;}
  header.h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:8px;}
  h1{
    font-family:var(--mono);font-weight:700;font-size:20px;letter-spacing:0.5px;
    color:var(--amber);margin:0;
  }
  h1 .dim{color:var(--text-dim);font-weight:400;}
  .subtitle{font-size:12px;color:var(--text-dim);font-family:var(--mono);}

  .metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:28px;}
  .metric{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:14px 16px;}
  .metric .label{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.6px;margin-bottom:6px;font-family:var(--sans);}
  .metric .value{font-family:var(--mono);font-size:22px;font-weight:500;}
  .metric .value.pos{color:var(--green);}
  .metric .value.neg{color:var(--red);}

  .grid2{display:grid;grid-template-columns:220px 1fr;gap:20px;align-items:start;}
  @media (max-width:720px){.grid2{grid-template-columns:1fr;}}

  .panel{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:20px;}
  .panel h2{
    font-family:var(--mono);font-size:13px;text-transform:uppercase;letter-spacing:0.8px;
    color:var(--amber-dim);margin:0 0 12px;border-bottom:1px solid var(--border);padding-bottom:8px;
  }

  .pair-row{
    display:flex;justify-content:space-between;padding:8px 0;font-family:var(--mono);font-size:12px;
    border-bottom:1px solid var(--border);
  }
  .pair-row:last-child{border-bottom:none;}
  .pair-row .name{color:var(--text);}
  .pair-row .pnl.pos{color:var(--green);}
  .pair-row .pnl.neg{color:var(--red);}
  .empty-note{color:var(--text-dim);font-size:12px;font-family:var(--mono);padding:8px 0;}

  form{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
  @media (max-width:640px){form{grid-template-columns:repeat(2,1fr);}}
  .field{display:flex;flex-direction:column;gap:4px;}
  .field label{font-size:10px;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-dim);}
  .field.full{grid-column:1/-1;}
  input,select{
    background:var(--surface-2);border:1px solid var(--border);color:var(--text);
    border-radius:4px;padding:8px 10px;font-family:var(--mono);font-size:13px;outline:none;
  }
  input:focus,select:focus{border-color:var(--border-strong);}
  input::placeholder{color:var(--text-dim);}
  .btn{
    grid-column:1/-1;background:transparent;border:1px solid var(--amber);color:var(--amber);
    padding:10px;border-radius:4px;font-family:var(--mono);font-size:13px;letter-spacing:0.5px;
    cursor:pointer;text-transform:uppercase;transition:background 0.15s;
  }
  .btn:hover{background:rgba(255,176,0,0.1);}
  .err{grid-column:1/-1;color:var(--red);font-size:12px;font-family:var(--mono);display:none;}

  table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12.5px;}
  th{
    text-align:left;color:var(--text-dim);font-weight:500;text-transform:uppercase;
    font-size:10px;letter-spacing:0.5px;padding:6px 8px;border-bottom:1px solid var(--border-strong);
  }
  td{padding:8px;border-bottom:1px solid var(--border);white-space:nowrap;}
  tr:last-child td{border-bottom:none;}
  .dir-buy{color:var(--green);}
  .dir-sell{color:var(--red);}
  .status-open{color:var(--amber);}
  .status-closed{color:var(--text-dim);}
  .pnl-pos{color:var(--green);}
  .pnl-neg{color:var(--red);}
  .tbl-actions button{
    background:none;border:1px solid var(--border);color:var(--text-dim);border-radius:3px;
    padding:3px 8px;font-family:var(--sans);font-size:11px;cursor:pointer;margin-right:4px;
  }
  .tbl-actions button:hover{border-color:var(--border-strong);color:var(--text);}
  .table-scroll{overflow-x:auto;}
  .loading{color:var(--text-dim);font-family:var(--mono);font-size:12px;padding:20px 0;text-align:center;}
</style>
</head>
<body>

<div class="ticker-wrap"><div class="ticker" id="tickerTape">Loading<span class="cursor"></span></div></div>

<div class="wrap">
  <header class="h">
    <h1>TRADE <span class="dim">LEDGER</span></h1>
    <div class="subtitle" id="dateNow"></div>
  </header>

  <div class="metrics" id="metrics">
    <div class="loading">Loading...</div>
  </div>

  <div class="grid2">
    <div>
      <div class="panel">
        <h2>Pair Summary</h2>
        <div id="pairSummary"></div>
      </div>
    </div>

    <div>
      <div class="panel">
        <h2>Add New Trade</h2>
        <form id="tradeForm">
          <div class="field">
            <label>Pair</label>
            <input type="text" id="f_pair" placeholder="EUR/USD" required>
          </div>
          <div class="field">
            <label>Direction</label>
            <select id="f_dir">
              <option value="buy">Buy</option>
              <option value="sell">Sell</option>
            </select>
          </div>
          <div class="field">
            <label>Entry Price</label>
            <input type="number" step="any" id="f_entry" placeholder="1.0850" required>
          </div>
          <div class="field">
            <label>Quantity / Lot</label>
            <input type="number" step="any" id="f_qty" placeholder="1" required>
          </div>
          <div class="field">
            <label>Exit Price (optional)</label>
            <input type="number" step="any" id="f_exit" placeholder="Leave blank if open">
          </div>
          <div class="field">
            <label>Open Date</label>
            <input type="date" id="f_odate">
          </div>
          <div class="field full">
            <label>Note (optional)</label>
            <input type="text" id="f_note" placeholder="e.g. NFP breakout">
          </div>
          <div class="err" id="formErr"></div>
          <button type="submit" class="btn">Save Trade</button>
        </form>
      </div>

      <div class="panel">
        <h2>Trade Log</h2>
        <div class="table-scroll">
          <table>
            <thead>
              <tr>
                <th>Pair</th><th>Direction</th><th>Entry</th><th>Exit</th><th>Qty</th>
                <th>Status</th><th>P&amp;L</th><th>Date</th><th></th>
              </tr>
            </thead>
            <tbody id="tradeBody">
              <tr><td colspan="9" class="loading">Loading...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = 'trades';
let trades = [];

document.getElementById('dateNow').textContent = new Date().toLocaleDateString('en-GB', {day:'2-digit', month:'short', year:'numeric'});

function uid(){ return 't' + Date.now() + Math.random().toString(36).slice(2,7); }

function calcPnl(t){
  if(t.exit === null || t.exit === undefined || t.exit === '') return null;
  const diff = (t.exit - t.entry) * (t.dir === 'buy' ? 1 : -1);
  return diff * t.qty;
}

async function loadTrades(){
  try{
    const res = await window.storage.get(STORAGE_KEY, false);
    trades = res ? JSON.parse(res.value) : [];
  }catch(e){
    trades = [];
  }
  render();
}

async function saveTrades(){
  try{
    await window.storage.set(STORAGE_KEY, JSON.stringify(trades), false);
  }catch(e){
    console.error('storage save failed', e);
  }
}

function fmt(n){
  if(n === null || n === undefined || isNaN(n)) return '—';
  return n.toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:4});
}

function render(){
  renderMetrics();
  renderTicker();
  renderPairs();
  renderTable();
}

function renderMetrics(){
  const closed = trades.filter(t => t.exit !== null && t.exit !== undefined && t.exit !== '');
  const open = trades.filter(t => t.exit === null || t.exit === undefined || t.exit === '');
  const totalPnl = closed.reduce((s,t) => s + calcPnl(t), 0);
  const wins = closed.filter(t => calcPnl(t) > 0).length;
  const winRate = closed.length ? Math.round((wins/closed.length)*100) : 0;

  const el = document.getElementById('metrics');
  el.innerHTML = `
    <div class="metric">
      <div class="label">Total P&amp;L</div>
      <div class="value ${totalPnl>0?'pos':totalPnl<0?'neg':''}">${totalPnl>=0?'+':''}${fmt(totalPnl)}</div>
    </div>
    <div class="metric">
      <div class="label">Open Positions</div>
      <div class="value">${open.length}</div>
    </div>
    <div class="metric">
      <div class="label">Win Rate</div>
      <div class="value">${winRate}%</div>
    </div>
    <div class="metric">
      <div class="label">Total Trades</div>
      <div class="value">${trades.length}</div>
    </div>
  `;
}

function renderTicker(){
  const open = trades.filter(t => t.exit === null || t.exit === undefined || t.exit === '');
  const tape = document.getElementById('tickerTape');
  if(!open.length){
    tape.innerHTML = 'No open positions<span class="cursor"></span>';
    return;
  }
  let html = '';
  open.forEach(t => {
    const dirLabel = t.dir === 'buy' ? '▲' : '▼';
    const cls = t.dir === 'buy' ? 'up' : 'down';
    html += `<span class="${cls}">${dirLabel} ${t.pair} @ ${fmt(t.entry)}</span>`;
  });
  tape.innerHTML = html + html + '<span class="cursor"></span>';
}

function renderPairs(){
  const el = document.getElementById('pairSummary');
  if(!trades.length){
    el.innerHTML = '<div class="empty-note">No trades yet.</div>';
    return;
  }
  const byPair = {};
  trades.forEach(t => {
    if(!byPair[t.pair]) byPair[t.pair] = {count:0, pnl:0};
    byPair[t.pair].count++;
    const p = calcPnl(t);
    if(p !== null) byPair[t.pair].pnl += p;
  });
  let html = '';
  Object.keys(byPair).sort().forEach(pair => {
    const d = byPair[pair];
    const cls = d.pnl > 0 ? 'pos' : d.pnl < 0 ? 'neg' : '';
    html += `<div class="pair-row"><span class="name">${pair} <span style="color:var(--text-dim)">(${d.count})</span></span><span class="pnl ${cls}">${d.pnl>=0?'+':''}${fmt(d.pnl)}</span></div>`;
  });
  el.innerHTML = html;
}

function renderTable(){
  const body = document.getElementById('tradeBody');
  if(!trades.length){
    body.innerHTML = '<tr><td colspan="9" class="empty-note">No trades logged yet. Use the form above to get started.</td></tr>';
    return;
  }
  const sorted = [...trades].sort((a,b) => (b.odate||'').localeCompare(a.odate||''));
  body.innerHTML = sorted.map(t => {
    const isOpen = t.exit === null || t.exit === undefined || t.exit === '';
    const pnl = calcPnl(t);
    const pnlCls = pnl === null ? '' : pnl >= 0 ? 'pnl-pos' : 'pnl-neg';
    return `<tr>
      <td>${t.pair}</td>
      <td class="dir-${t.dir}">${t.dir === 'buy' ? 'Buy' : 'Sell'}</td>
      <td>${fmt(t.entry)}</td>
      <td>${isOpen ? '—' : fmt(t.exit)}</td>
      <td>${t.qty}</td>
      <td class="status-${isOpen?'open':'closed'}">${isOpen ? 'Open' : 'Closed'}</td>
      <td class="${pnlCls}">${pnl===null?'—':(pnl>=0?'+':'')+fmt(pnl)}</td>
      <td>${t.odate || '—'}</td>
      <td class="tbl-actions">
        ${isOpen ? `<button onclick="closePosition('${t.id}')">Close</button>` : ''}
        <button onclick="deleteTrade('${t.id}')">Delete</button>
      </td>
    </tr>`;
  }).join('');
}

async function closePosition(id){
  const price = prompt('Enter exit price:');
  if(price === null || price === '' || isNaN(price)) return;
  const t = trades.find(x => x.id === id);
  if(t){ t.exit = parseFloat(price); await saveTrades(); render(); }
}

async function deleteTrade(id){
  if(!confirm('Delete this trade?')) return;
  trades = trades.filter(t => t.id !== id);
  await saveTrades();
  render();
}

document.getElementById('tradeForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errEl = document.getElementById('formErr');
  errEl.style.display = 'none';

  const pair = document.getElementById('f_pair').value.trim().toUpperCase();
  const dir = document.getElementById('f_dir').value;
  const entry = parseFloat(document.getElementById('f_entry').value);
  const qty = parseFloat(document.getElementById('f_qty').value);
  const exitRaw = document.getElementById('f_exit').value;
  const exit = exitRaw === '' ? null : parseFloat(exitRaw);
  const odate = document.getElementById('f_odate').value || new Date().toISOString().slice(0,10);
  const note = document.getElementById('f_note').value.trim();

  if(!pair || isNaN(entry) || isNaN(qty) || qty <= 0){
    errEl.textContent = 'Please fill in pair, entry price, and quantity correctly.';
    errEl.style.display = 'block';
    return;
  }

  trades.push({ id: uid(), pair, dir, entry, exit, qty, odate, note });
  await saveTrades();
  render();
  e.target.reset();
});

loadTrades();
</script>

</body>
</html>
